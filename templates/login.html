
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Travel Explorer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f7f2;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }

        .card {
            background: white;
            width: min(360px, 85%);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px #0001;
        }

        h1 { color: #176b50; margin-top: 0; }
        p { color: #58665d; }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccd8ce;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #176b50;
            color: white;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        a { color: #176b50; }
        .message {
            background: #fff3cd;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Welcome back!</h1>
        <p>Log in to Travel Explorer.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <label for="email">Email address</label>
            <input
                id="email"
                name="email"
                type="email"
                required
                autocomplete="email"
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                required
                autocomplete="current-password"
            >

            <button type="submit">Log in</button>
        </form>

        <p>Don't have an account?
            <a href="{{ url_for('register') }}">Create one</a>
        </p>

        <p>
            <a href="{{ url_for('home') }}">← Back to destinations</a>
        </p>
    </main>
</body>
</html>
